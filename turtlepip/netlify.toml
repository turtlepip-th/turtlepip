[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/reviews/pepperstone/"
  to = "/reviews/pepperstone"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/exness/"
  to = "/reviews/exness"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/xs-com/"
  to = "/reviews/xs-com"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/xm/"
  to = "/reviews/xm"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/hfm/"
  to = "/reviews/hfm"
  status = 301
  force = true

[[redirects]]
  from = "/rebate/"
  to = "/rebate"
  status = 301
  force = true

[[redirects]]
  from = "/compare/"
  to = "/compare"
  status = 301
  force = true

[[redirects]]
  from = "/best-gold-broker-thailand/"
  to = "/best-gold-broker-thailand"
  status = 301
  force = true

[[redirects]]
  from = "/lowest-spread-broker/"
  to = "/lowest-spread-broker"
  status = 301
  force = true

[[redirects]]
  from = "/blacklist/"
  to = "/blacklist"
  status = 301
  force = true

[[redirects]]
  from = "/matcher/"
  to = "/matcher"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mascot/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
